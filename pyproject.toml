[project]
name = "ricemap"
version = "0.1.0"
description = "Rice crop mapping for the Mekong Delta from Sentinel-1 SAR"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "joblib",
    "xarray",
    "rioxarray",
    "rasterio",
    "geopandas",
    "pyproj",
    "pystac-client",
    "planetary-computer",
    "odc-stac",
    "fsspec",
    "gcsfs",
    "pyyaml",
    "python-dotenv",
    "typer",
]

[project.scripts]
ricemap = "ricemap.cli:app"

[dependency-groups]
dev = ["pytest", "ruff", "jupyter", "matplotlib", "seaborn"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ricemap"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
